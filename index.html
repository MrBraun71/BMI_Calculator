<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore BMI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
</head>
<body>
    <header>
        <div class="header-content">
            <span class="logo-cross">+</span>
            <div class="header-text">
                <h1>Calcolatore BMI</h1>
                <p>Itinerari della Salute — Croce Rossa Molfetta</p>
            </div>
        </div>
    </header>

    <main>
        <div class="app-container">
            <div class="card">
                <div class="input-group">
                    <label for="weight">Peso (kg)</label>
                    <input type="number" id="weight" step="0.1" placeholder="es. 70">
                </div>
                <div class="input-group">
                    <label for="height">Altezza (cm)</label>
                    <input type="number" id="height" step="1" placeholder="es. 175">
                </div>
                <div class="input-group">
                    <label for="age">Età</label>
                    <input type="number" id="age" placeholder="es. 30">
                </div>
                <div class="input-group">
                    <label for="gender">Sesso</label>
                    <select id="gender">
                        <option value="male">Maschio</option>
                        <option value="female">Femmina</option>
                    </select>
                </div>
                <button onclick="calculateBMI()">Calcola BMI</button>
            </div>

            <div id="result-container" class="hidden">
                <div class="result-card">
                    <span id="bmi-value">0</span>
                    <p id="bmi-label">Il tuo BMI</p>
                </div>
                <div class="result-detail">
                    <p id="bmi-category"></p>
                    <p id="bmi-info"></p>
                </div>
            </div>
            
            <footer>
                <p>Croce Rossa Italiana - Comitato di Molfetta</p>
                <p>&copy; 2026</p>
            </footer>
        </div>
    </main>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
    <script src="script.js"></script>
</body>
</html>
