<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore BMI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5c6bc0">
</head>
<body>
    <div class="container">
        <h1>Calcolatore BMI</h1>
        <div class="input-group">
            <label for="weight">Peso (kg)</label>
            <input type="number" id="weight" step="0.1" placeholder="es. 70">
        </div>
        <div class="input-group">
            <label for="height">Altezza (cm)</label>
            <input type="number" id="height" step="1" placeholder="es. 175">
        </div>
        <div class="input-group">
            <label for="age">Età</label>
            <input type="number" id="age" placeholder="es. 30">
        </div>
        <div class="input-group">
            <label for="gender">Sesso</label>
            <select id="gender" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px;">
                <option value="male">Maschio</option>
                <option value="female">Femmina</option>
            </select>
        </div>
        <button onclick="calculateBMI()">Calcola BMI</button>
        <div id="result"></div>
        
        <footer style="margin-top: 30px; font-size: 0.8em; color: #777;">
            <p>Croce Rossa Italiana - Comitato di Molfetta</p>
            <p>&copy; 2026</p>
        </footer>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
    <script src="script.js"></script>
</body>
</html>
